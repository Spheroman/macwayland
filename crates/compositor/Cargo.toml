[package]
name = "macwl-compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
rustix = { version = "1.1.5", features = ["fs", "mm", "shm"] }
tempfile = "3"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }
