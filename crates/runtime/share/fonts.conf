<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- What Linux programs under macwl-run see as their fontconfig setup when
     they don't bring their own (FONTCONFIG_FILE): the Mac's fonts, with the
     generic families pointing at Mac ones. -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- Linux desktops' usual families, each after its own name (so an
       installed one is still used): GTK's Adwaita theme asks for Cantarell
       or Adwaita Sans, and Firefox only looks at what follows a name
       directly. -->
  <alias><family>Cantarell</family><default><family>sans-serif</family></default></alias>
  <alias><family>Adwaita Sans</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans</family><default><family>sans-serif</family></default></alias>
  <alias><family>DejaVu Sans</family><default><family>sans-serif</family></default></alias>
  <alias><family>Liberation Sans</family><default><family>sans-serif</family></default></alias>
  <alias><family>Ubuntu</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Serif</family><default><family>serif</family></default></alias>
  <alias><family>DejaVu Serif</family><default><family>serif</family></default></alias>
  <alias><family>Liberation Serif</family><default><family>serif</family></default></alias>
  <alias><family>Adwaita Mono</family><default><family>monospace</family></default></alias>
  <alias><family>Noto Sans Mono</family><default><family>monospace</family></default></alias>
  <alias><family>DejaVu Sans Mono</family><default><family>monospace</family></default></alias>
  <alias><family>Liberation Mono</family><default><family>monospace</family></default></alias>
  <!-- A family that isn't here falls back on a generic one, as on Linux
       (fontconfig's 49-sansserif.conf): without this, fontconfig takes
       whatever scores best, which is Hiragino Maru Gothic. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>
  <alias><family>monospace</family><prefer><family>Menlo</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Helvetica</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Times</family></prefer></alias>
  <!-- The other names Linux setups give them (GTK asks for "Sans"). -->
  <alias><family>Sans</family><prefer><family>Helvetica</family></prefer></alias>
  <alias><family>Serif</family><prefer><family>Times</family></prefer></alias>
  <alias><family>Monospace</family><prefer><family>Menlo</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Helvetica</family></prefer></alias>
  <config><rescan><int>30</int></rescan></config>
</fontconfig>
